<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Predictor</title>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        min-height: 100vh;
        padding: 40px 20px;
        background:
            radial-gradient(circle at 15% 20%, #164e9a 0, transparent 35%),
            radial-gradient(circle at 85% 80%, #6d28d9 0, transparent 35%),
            linear-gradient(135deg, #020617, #111827, #1e1b4b);
        color: #f8fafc;
        position: relative;
        overflow-x: hidden;
    }

    /* BACKGROUND WATERMARK */
    body::before {
        content: "STUDENT PREDICTOR";
        position: fixed;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-25deg);
        font-size: clamp(35px, 8vw, 100px);
        font-weight: 900;
        letter-spacing: 12px;
        color: rgba(255, 255, 255, 0.025);
        white-space: nowrap;
        pointer-events: none;
        z-index: 0;
    }

    .container {
        position: relative;
        z-index: 1;
        max-width: 750px;
        margin: auto;
        padding: 35px;
        border-radius: 22px;
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border: 1px solid rgba(96, 165, 250, 0.35);
        box-shadow:
            0 0 20px rgba(59, 130, 246, 0.25),
            0 0 60px rgba(124, 58, 237, 0.15),
            inset 0 0 20px rgba(255, 255, 255, 0.03);
    }

    h1, h2 {
        text-align: center;
        color: #ffffff;
        margin-bottom: 12px;
        text-shadow: 0 0 12px rgba(96, 165, 250, 0.8);
    }

    .subtitle {
        text-align: center;
        color: #a5b4fc;
        margin-bottom: 30px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    label {
        display: block;
        margin-bottom: 9px;
        color: #c7d2fe;
        font-weight: 600;
        font-size: 14px;
    }

    input, select {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid rgba(96, 165, 250, 0.35);
        background: rgba(15, 23, 42, 0.9);
        color: #ffffff;
        font-size: 15px;
        transition: 0.3s ease;
    }

    input::placeholder {
        color: #94a3b8;
    }

    input:focus, select:focus {
        outline: none;
        border-color: #38bdf8;
        box-shadow:
            0 0 8px #38bdf8,
            0 0 20px rgba(56, 189, 248, 0.3);
    }

    select option {
        background: #0f172a;
        color: white;
    }

    button {
        width: 100%;
        padding: 16px;
        margin-top: 28px;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 10px;
        background: linear-gradient(90deg, #2563eb, #7c3aed);
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s ease;
        box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow:
            0 0 15px #38bdf8,
            0 0 30px rgba(124, 58, 237, 0.6);
    }

    .result-box, .result {
        margin-top: 30px;
        padding: 25px;
        border-radius: 15px;
        background: rgba(30, 41, 59, 0.85);
        border: 1px solid rgba(56, 189, 248, 0.5);
        box-shadow:
            0 0 15px rgba(56, 189, 248, 0.2),
            inset 0 0 15px rgba(56, 189, 248, 0.05);
        color: #e2e8f0;
        line-height: 2;
        text-align: center;
    }

    .marks {
        font-size: 40px;
        font-weight: bold;
        color: #38bdf8;
        text-shadow: 0 0 15px rgba(56, 189, 248, 0.8);
        margin: 15px 0;
    }

    .pass {
        color: #4ade80;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(74, 222, 128, 0.6);
    }

    .fail {
        color: #fb7185;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(251, 113, 133, 0.6);
    }

    .error {
        margin-top: 20px;
        padding: 12px;
        border-radius: 8px;
        background: rgba(127, 29, 29, 0.4);
        color: #fca5a5;
        text-align: center;
    }

    @media (max-width: 600px) {
        body {
            padding: 20px 12px;
        }

        .container {
            padding: 22px;
        }

        .form-grid {
            grid-template-columns: 1fr;
        }

        .form-group.full {
            grid-column: auto;
        }
    }
</style>

</head>

<body>

<div class="container">

    <h2>Student Marks Predictor</h2>

    <form onsubmit="predictMarks(event)">

        <label>Student Name</label>
        <input type="text" id="predictName" placeholder="Enter student name" required>

        <label>Study Hours Per Day</label>
        <input type="number" id="hours" min="0" max="24" step="any" required>

        <label>Internet Access</label>
        <select id="internet" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Travel Time (Minutes)</label>
        <input type="number" id="travel" min="0" required>

        <label>Previous Failures</label>
        <input type="number" id="failures" min="0" required>

        <label>School Absences</label>
        <input type="number" id="absences" min="0" required>

        <label>Study Time Level</label>
        <select id="studytime" required>
            <option value="">Select Study Time</option>
            <option value="1">Level 1 - Less than 2 hours</option>
            <option value="2">Level 2 - 2 to 5 hours</option>
            <option value="3">Level 3 - 5 to 10 hours</option>
            <option value="4">Level 4 - More than 10 hours</option>
        </select>

        <label>Previous Marks (0-100)</label>
        <input type="number" id="previous" min="0" max="100" step="any" required>

        <button type="submit">Predict Marks</button>

    </form>

    <div id="predictionResult" class="result-box"></div>

</div>

<script>
function predictMarks(event) {

    event.preventDefault();

    let name = document.getElementById("predictName").value;
    let hours = Number(document.getElementById("hours").value);
    let internet = Number(document.getElementById("internet").value);
    let travel = Number(document.getElementById("travel").value);
    let failures = Number(document.getElementById("failures").value);
    let absences = Number(document.getElementById("absences").value);
    let studytime = Number(document.getElementById("studytime").value);
    let previous = Number(document.getElementById("previous").value);

    if (
        !name.trim() ||
        document.getElementById("hours").value === "" ||
        document.getElementById("internet").value === "" ||
        document.getElementById("travel").value === "" ||
        document.getElementById("failures").value === "" ||
        document.getElementById("absences").value === "" ||
        document.getElementById("studytime").value === "" ||
        document.getElementById("previous").value === "" ||
        hours < 0 || hours > 24 ||
        ![0, 1].includes(internet) ||
        travel < 0 || failures < 0 || absences < 0 ||
        ![1, 2, 3, 4].includes(studytime) ||
        previous < 0 || previous > 100
    ) {
        alert("Please enter valid student details.");
        return;
    }

    // DEMO ESTIMATION ONLY - NOT A TRAINED ML MODEL
    let prediction =
        (hours * 3) +
        (internet * 2) -
        (travel * 0.1) -
        (failures * 3) -
        (absences * 0.2) +
        (studytime * 2) +
        (previous * 0.7);

    prediction = Math.min(100, Math.max(0, prediction));

    let status = prediction >= 35 ? "PASS" : "FAIL";

    let result = document.getElementById("predictionResult");

    result.style.display = "block";

    result.innerHTML = `
        <h3>📊 Prediction Result</h3>
        Student: <b>${name.replace(/[&<>"']/g, "")}</b><br>
        Study Hours: <b>${hours}</b><br>
        Internet Access: <b>${internet === 1 ? "Yes" : "No"}</b><br>
        Travel Time: <b>${travel} minutes</b><br>
        Previous Failures: <b>${failures}</b><br>
        School Absences: <b>${absences}</b><br>
        Study Time Level: <b>${studytime}</b><br>
        Previous Marks: <b>${previous}</b><br><br>

        Predicted Marks:
        <div class="marks">${prediction.toFixed(2)} / 100</div>

        Final Result:
        <b class="${status === 'PASS' ? 'pass' : 'fail'}">${status}</b>
    `;
}
</script>

</body>
</html>
